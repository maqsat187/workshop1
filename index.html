<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #222; }

  .brand h1 { margin: 0; }
  h1 { font-size: 22px; }
  h2 { font-size: 18px; }
  .task { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 14px 0; }

  .points { color: #888; font-size: 13px; }
  .timer { font-size: 20px; font-weight: bold; margin-bottom: 12px; }

  input[type="text"].correct { border: 2px solid #2e9e3f; background: #f1fbf2; }
  input[type="text"].wrong { border: 2px solid #d9483d; background: #fdf1f0; }
  button { padding: 10px 16px; font-size: 15px; margin-top: 10px; margin-right: 8px; cursor: pointer; }
  select { padding: 8px; font-size: 15px; margin-right: 8px; }
  .feedback { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 15px; }
  .feedback.correct { background: #f1fbf2; color: #206d2c; }
  .feedback.wrong { background: #fdf1f0; color: #a3352b; }
  .explain { margin-top: 10px; padding: 10px; border-radius: 6px; background: #fff8e6; color: #6b5300; font-size: 14px; }
  .task-image { max-width: 100%; height: auto; display: block; margin: 10px 0; border-radius: 6px; border: 1px solid #eee; }
  #result { font-size: 18px; font-weight: bold; margin: 16px 0; }
  #history { margin-top: 32px; }
  #history table { border-collapse: collapse; width: 100%; }
  #history td, #history th { border: 1px solid #ddd; padding: 6px 10px; text-align: left; font-size: 14px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; margin-bottom: 4px; font-size: 14px; color: #555; }
  #logout { font-size: 13px; color: #888; cursor: pointer; text-decoration: underline; }
  #password-gate-error { color: #a3352b; font-size: 14px; }
  #admin { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 14px 0; background: #fafafa; }

  const TIME_LIMIT = 10 * 60; // 10 минут әр сұраққа
  const MAX_ATTEMPTS = 3;

  let currentStudent = localStorage.getItem("mathAppStudent") || null;
  let isAdmin = false;
  let currentTourKey = null;
  let currentGrade = null;
  let currentTasks = null;
  let currentIndex = 0;
  let score = 0;
  let answers = {};
  let missed = [];
  let secondsLeft = TIME_LIMIT;
  let attemptsLeft = MAX_ATTEMPTS;
  let timerHandle = null;
  let reviewMode = false;

  function normalizeAnswer(str) {
    return str
      .toLowerCase()
      .replace(/ё/g, "е")
      .replace(/[–—]/g, "-")
      .replace(/\bи\b/g, ",")
      .replace(/\s*-\s*/g, "-")
      .split(/[,;]+/)
      .map((p) => p.trim().replace(/\s+/g, " "))
      .filter((p) => p.length > 0)
      .sort()
      .join(",");
  }

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${String(sec).padStart(2, "0")}`;
  }

  function hideAll() {
    document.getElementById("login").style.display = "none";
    document.getElementById("select").style.display = "none";
    document.getElementById("admin").style.display = "none";
    document.getElementById("history").style.display = "none";
  }

  let pendingLoginName = null;

  function showLogin() {
    hideAll();
    document.getElementById("login").style.display = "block";
    document.getElementById("password-gate").style.display = "none";
    document.getElementById("password-gate-error").textContent = "";
    document.getElementById("password-gate-input").value = "";
    const box = document.getElementById("login-buttons");
    box.innerHTML = "";
    for (const name of STUDENTS) {
      const btn = document.createElement("button");
      btn.textContent = name;
      btn.onclick = () => {
        pendingLoginName = name;
        document.getElementById("password-gate-name").textContent = name;
        document.getElementById("password-gate-error").textContent = "";
        document.getElementById("password-gate-input").value = "";
        document.getElementById("password-gate").style.display = "block";
        document.getElementById("password-gate-input").focus();
      };
      box.appendChild(btn);
    }
  }

  document.getElementById("password-gate-btn").onclick = () => {
    const pw = document.getElementById("password-gate-input").value;
    const expected = pendingLoginName === ADMIN_NAME ? ADMIN_PASSWORD : STUDENT_PASSWORDS[pendingLoginName];
    if (pw === expected) {
      currentStudent = pendingLoginName;
      localStorage.setItem("mathAppStudent", pendingLoginName);
      if (pendingLoginName === ADMIN_NAME) {
        isAdmin = true;
        showAdmin();
      } else {
        showSelect();
      }
    } else {
      document.getElementById("password-gate-error").textContent = "Қате пароль.";
    }
  };
  document.getElementById("password-gate-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("password-gate-btn").click();
  });

  function showAdmin() {
    hideAll();
    document.getElementById("admin").style.display = "block";
    document.getElementById("history").style.display = "block";
    loadHistory();
  }

  function populateGrades() {
    const tourKey = document.getElementById("tour-select").value;
    const gradeSelect = document.getElementById("grade-select");
    gradeSelect.innerHTML = "";
    const grades = Object.keys(TOURS[tourKey].grades).sort((a, b) => a - b);
    for (const g of grades) {
      const opt = document.createElement("option");
      opt.value = g;
      opt.textContent = `${g} сынып`;
      gradeSelect.appendChild(opt);
    }
  }

  function showSelect() {
    hideAll();
    document.getElementById("select").style.display = "block";
    document.getElementById("greeting").textContent = currentStudent;

    const tourSelect = document.getElementById("tour-select");
    tourSelect.innerHTML = "";
    for (const key in TOURS) {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = TOURS[key].label;
      tourSelect.appendChild(opt);
    }
    tourSelect.onchange = populateGrades;

    populateGrades();

    document.getElementById("history").style.display = "block";
    loadHistory();
  }

  function logout() {
    currentStudent = null;
    isAdmin = false;
    localStorage.removeItem("mathAppStudent");
    showLogin();
  }

  document.getElementById("logout").onclick = logout;
  document.getElementById("logout-admin").onclick = logout;

  document.getElementById("start-btn").onclick = () => {
    currentGrade = document.getElementById("grade-select").value;
    currentTourKey = document.getElementById("tour-select").value;
    currentTasks = TOURS[currentTourKey].grades[currentGrade];
    currentIndex = 0;
    score = 0;
    answers = {};
    missed = [];
    reviewMode = false;
    document.getElementById("select").style.display = "none";
    document.getElementById("history").style.display = "none";
    document.getElementById("result").innerHTML = "";
    renderQuestion();
  };

  function renderQuestion() {
    const task = currentTasks[currentIndex];
    attemptsLeft = MAX_ATTEMPTS;

    const quiz = document.getElementById("quiz");
    quiz.style.display = "block";

    const timerHtml = reviewMode
      ? `<div class="timer">Уақыт шектеусіз (папамен бірге)</div>`
      : `<div class="timer" id="timer">${formatTime(TIME_LIMIT)}</div>`;

    quiz.innerHTML = `
      <div class="task">
        ${timerHtml}
        <p><b>${task.id}/${currentTasks.length}.</b> ${task.text} <span class="points">(${task.points} балл)</span></p>
        ${task.image ? `<img class="task-image" src="${task.image}" alt="Есеп суреті">` : ""}
        <p class="points" id="attempts-left">Талпыныс: ${attemptsLeft} / ${MAX_ATTEMPTS}</p>
        <input type="text" id="answer-input" placeholder="Жауабы" autofocus />
        <div>
          <button id="submit-btn">Жауап беру</button>
          <button id="skip-btn" type="button">Келесі сұраққа өту</button>
          ${reviewMode ? `<button id="reveal-btn" type="button">Жауабы мен шешімін көрсету</button>` : ""}
        </div>
        <div id="feedback"></div>
      </div>
    `;

    document.getElementById("submit-btn").onclick = () => checkAnswer(false);
    document.getElementById("answer-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkAnswer(false);
    });
    document.getElementById("skip-btn").onclick = skipQuestion;
    if (reviewMode) {
      document.getElementById("reveal-btn").onclick = revealSolution;
    }

    clearInterval(timerHandle);
    if (!reviewMode) {
      secondsLeft = TIME_LIMIT;
      timerHandle = setInterval(() => {
        secondsLeft--;
        const timerEl = document.getElementById("timer");
        timerEl.textContent = formatTime(secondsLeft);
        if (secondsLeft <= 60) timerEl.classList.add("low");
        if (secondsLeft <= 0) {
          clearInterval(timerHandle);
          checkAnswer(true);
        }
      }, 1000);
    }
  }

  function checkAnswer(timedOut) {
    const task = currentTasks[currentIndex];
    const input = document.getElementById("answer-input");
    const given = timedOut ? "" : input.value.trim();
    const isCorrect = !timedOut && given.length > 0 && normalizeAnswer(given) === normalizeAnswer(task.answer);

    if (!isCorrect && !timedOut) {
      attemptsLeft--;
    }

    const outOfTries = !isCorrect && attemptsLeft <= 0;

    if (isCorrect || timedOut || outOfTries) {
      clearInterval(timerHandle);
      input.disabled = true;
      document.getElementById("submit-btn").disabled = true;
      input.classList.add(isCorrect ? "correct" : "wrong");

      if (!reviewMode) {
        answers[task.id] = { given, correct: isCorrect, attempts: MAX_ATTEMPTS - attemptsLeft + (isCorrect ? 1 : 0) };
      }

      const feedback = document.getElementById("feedback");
      feedback.className = "feedback " + (isCorrect ? "correct" : "wrong");
      if (isCorrect) {
        if (!reviewMode) score += task.points;
        feedback.textContent = `Дұрыс! Жауабы: ${task.answer}. Келесі есепке өтейік.`;
      } else {
        if (!reviewMode) missed.push(task);
        if (reviewMode) {
          feedback.textContent = `Талпыныстар бітті.`;
          const explainDiv = document.createElement("div");
          explainDiv.className = "explain";
          explainDiv.innerHTML = `<b>Толық шешімі:</b> ${task.explain || "Түсіндірме жоқ."} <br><b>Жауабы:</b> ${task.answer}`;
          feedback.appendChild(explainDiv);
        } else if (timedOut) {
          feedback.textContent = `Уақыт бітті. Бұл есепті папамен бірге шешейік!`;
        } else {
          feedback.textContent = `Талпыныстар бітті. Бұл есепті папамен бірге шешейік!`;
        }
      }

      const nextBtn = document.createElement("button");
      nextBtn.textContent = currentIndex + 1 < currentTasks.length ? "Келесі сұрақ" : "Аяқтау";
      nextBtn.onclick = nextQuestion;
      feedback.appendChild(document.createElement("br"));
      feedback.appendChild(nextBtn);
    } else {
      document.getElementById("attempts-left").textContent = `Талпыныс: ${attemptsLeft} / ${MAX_ATTEMPTS}`;
      const feedback = document.getElementById("feedback");
      feedback.className = "feedback wrong";
      feedback.textContent = `Қате жауап. Тағы ${attemptsLeft} талпыныс бар — қайталап көр!`;
      input.value = "";
      input.focus();
    }
  }

  function skipQuestion() {
    const task = currentTasks[currentIndex];
    clearInterval(timerHandle);
    const input = document.getElementById("answer-input");
    const given = input.value.trim();
    input.disabled = true;
    input.classList.add("wrong");
    document.getElementById("submit-btn").disabled = true;
    document.getElementById("skip-btn").disabled = true;
    const revealBtn = document.getElementById("reveal-btn");
    if (revealBtn) revealBtn.disabled = true;

    if (!reviewMode) {
      answers[task.id] = { given, correct: false, attempts: MAX_ATTEMPTS - attemptsLeft };
      missed.push(task);
    }

    const feedback = document.getElementById("feedback");
    feedback.className = "feedback wrong";
    feedback.textContent = reviewMode
      ? "Өткізіп жіберілді."
      : "Сұрақ өткізіп жіберілді. Бұл есепті папамен бірге шешейік!";

    const nextBtn = document.createElement("button");
    nextBtn.textContent = currentIndex + 1 < currentTasks.length ? "Келесі сұрақ" : "Аяқтау";
    nextBtn.onclick = nextQuestion;
    feedback.appendChild(document.createElement("br"));
    feedback.appendChild(nextBtn);
  }

  function revealSolution() {
    const task = currentTasks[currentIndex];
    clearInterval(timerHandle);
    document.getElementById("answer-input").disabled = true;
    document.getElementById("submit-btn").disabled = true;
    document.getElementById("reveal-btn").disabled = true;

    const feedback = document.getElementById("feedback");
    feedback.className = "feedback wrong";
    feedback.textContent = "Жауабы мен шешімі:";
    const explainDiv = document.createElement("div");
    explainDiv.className = "explain";
    explainDiv.innerHTML = `<b>Толық шешімі:</b> ${task.explain || "Түсіндірме жоқ."} <br><b>Жауабы:</b> ${task.answer}`;
    feedback.appendChild(explainDiv);

    const nextBtn = document.createElement("button");
    nextBtn.textContent = currentIndex + 1 < currentTasks.length ? "Келесі сұрақ" : "Аяқтау";
    nextBtn.onclick = nextQuestion;
    feedback.appendChild(document.createElement("br"));
    feedback.appendChild(nextBtn);
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentTasks.length) {
      renderQuestion();
    } else if (reviewMode) {
      finishReview();
    } else {
      finishQuiz();
    }
  }

  function finishReview() {
    document.getElementById("quiz").style.display = "none";
    const result = document.getElementById("result");
    result.innerHTML = `<div>Қайталау аяқталды!</div>`;
    const back = document.createElement("button");
    back.textContent = "Админ панеліне оралу";
    back.onclick = () => {
      result.innerHTML = "";
      showAdmin();
    };
    result.appendChild(back);
  }

  async function finishQuiz() {
    document.getElementById("quiz").style.display = "none";
    const maxScore = currentTasks.reduce((sum, t) => sum + t.points, 0);
    const result = document.getElementById("result");
    result.innerHTML = `<div id="final-score">Нәтиже: ${score} / ${maxScore} балл</div>`;

    if (missed.length > 0) {
      const review = document.createElement("div");
      review.innerHTML = `<h2>Папамен бірге шешетін есептер</h2>`;
      for (const task of missed) {
        const div = document.createElement("div");
        div.className = "task";
        div.innerHTML = `
          <p><b>${task.id}.</b> ${task.text} <span class="points">(${task.points} балл)</span></p>
          ${task.image ? `<img class="task-image" src="${task.image}" alt="Есеп суреті">` : ""}
          <p><i>Дұрыс жауабы (папаға): ${task.answer}</i></p>
        `;
        review.appendChild(div);
      }
      result.appendChild(review);
    }

    const again = document.createElement("button");
    again.textContent = "Тағы бір тест шешу";
    again.onclick = () => {
      result.innerHTML = "";
      showSelect();
    };
    result.appendChild(again);

    const { error } = await client.from("workshop_data").insert({
      participant_id: PARTICIPANT_ID,
      item_type: "attempt",
      data: {
        student: currentStudent,
        tour: currentTourKey,
        tourLabel: TOURS[currentTourKey].label,
        grade: currentGrade,
        date: todayStr(),
        score,
        maxScore,
        answers,
      },
    });
    if (error) console.error(error);

    document.getElementById("history").style.display = "block";
    loadHistory();
  }

  function startReview(row) {
    const tourKey = row.data.tour;
    const grade = row.data.grade;
    const tourData = TOURS[tourKey];
    if (!tourData || !tourData.grades[grade]) return;
    const allTasks = tourData.grades[grade];
    const answersObj = row.data.answers || {};
    const wrongTasks = allTasks.filter((t) => {
      const entry = answersObj[t.id];
      if (!entry) return false;
      const legacy = typeof entry === "string";
      const given = legacy ? entry : entry.given;
      const liveCorrect = !!(given && normalizeAnswer(given) === normalizeAnswer(t.answer));
      return !liveCorrect;
    });
    if (wrongTasks.length === 0) return;

    currentTourKey = tourKey;
    currentGrade = grade;
    currentTasks = wrongTasks;
    currentIndex = 0;
    score = 0;
    answers = {};
    missed = [];
    reviewMode = true;
    hideAll();
    document.getElementById("result").innerHTML = "";
    renderQuestion();
  }

  function startReviewQuestion(row, qId) {
    const tourKey = row.data.tour;
    const grade = row.data.grade;
    const tourData = TOURS[tourKey];
    if (!tourData || !tourData.grades[grade]) return;
    const task = tourData.grades[grade].find((t) => String(t.id) === String(qId));
    if (!task) return;

    currentTourKey = tourKey;
    currentGrade = grade;
    currentTasks = [task];
    currentIndex = 0;
    score = 0;
    answers = {};
    missed = [];
    reviewMode = true;
    hideAll();
    document.getElementById("result").innerHTML = "";
    renderQuestion();
  }

  async function loadHistory() {
    if (!currentStudent) return;

    let query = client
      .from("workshop_data")
      .select("*")
      .eq("participant_id", PARTICIPANT_ID)
      .eq("item_type", "attempt");

    if (!isAdmin) {
      query = query.eq("data->>student", currentStudent);
    }

    const { data, error } = await query.order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      return;
    }

    const body = document.getElementById("history-body");
    body.innerHTML = "";
    data.forEach((row, i) => {
      const tourData = TOURS[row.data.tour];
      const tasks = tourData && tourData.grades[row.data.grade];
      const taskById = {};
      if (tasks) tasks.forEach((t) => { taskById[t.id] = t; });

      const answersObj = row.data.answers || {};
      const qIds = Object.keys(answersObj).sort((a, b) => a - b);

      // Пересчепейміз: сақталған "дұрыс/қате" белгісіне емес, TOURS-тағы
      // ағымдағы жауап кілтіне сүйенеміз — жауап кейін түзетілген болса,
      // тарих та автоматты түрде жаңарады.
      let liveScore = 0;
      let liveMaxScore = tasks ? tasks.reduce((sum, t) => sum + t.points, 0) : row.data.maxScore;
      const liveCorrectById = {};
      qIds.forEach((qId) => {
        const entry = answersObj[qId];
        const legacy = typeof entry === "string";
        const given = legacy ? entry : entry && entry.given;
        const task = taskById[qId];
        const liveCorrect = task ? !!(given && normalizeAnswer(given) === normalizeAnswer(task.answer)) : undefined;
        liveCorrectById[qId] = liveCorrect;
        if (liveCorrect && task) liveScore += task.points;
      });

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${row.data.student || ""}</td>
        <td>${row.data.tourLabel || ""}</td>
        <td>${row.data.grade || ""}</td>
        <td>${row.data.date}</td>
        <td>${liveScore} / ${liveMaxScore}</td>
        <td><button type="button" data-idx="${i}">Толығырақ</button></td>
      `;
      body.appendChild(tr);

      const detailTr = document.createElement("tr");
      detailTr.style.display = "none";
      const detailTd = document.createElement("td");
      detailTd.colSpan = 6;

      qIds.forEach((qId) => {
        const entry = answersObj[qId];
        const legacy = typeof entry === "string";
        const given = legacy ? entry : entry && entry.given;
        const correct = liveCorrectById[qId];
        const mark = correct === true ? "✓ дұрыс" : correct === false ? "✗ қате" : "— ескі жазба";
        const givenText = given ? ` (жауабы: ${given})` : " (жауап берілмеді)";

        const qDiv = document.createElement("div");
        qDiv.textContent = `${qId}-сұрақ: ${mark}${givenText}`;

        if (isAdmin && correct !== true) {
          const soloBtn = document.createElement("button");
          soloBtn.type = "button";
          soloBtn.textContent = "Осы сұрақты бірге шешу";
          soloBtn.style.marginLeft = "8px";
          soloBtn.onclick = () => startReviewQuestion(row, qId);
          qDiv.appendChild(soloBtn);
        }
        detailTd.appendChild(qDiv);
      });

      if (isAdmin) {
        const hasWrong = qIds.some((qId) => liveCorrectById[qId] !== true);
        if (hasWrong) {
          const reviewBtn = document.createElement("button");
          reviewBtn.type = "button";
          reviewBtn.textContent = "Барлық қате есептерді бірге қайта шешу";
          reviewBtn.onclick = () => startReview(row);
          detailTd.appendChild(document.createElement("br"));
          detailTd.appendChild(reviewBtn);
        }
      }

      detailTr.appendChild(detailTd);
      body.appendChild(detailTr);

      tr.querySelector("button").onclick = () => {
        detailTr.style.display = detailTr.style.display === "none" ? "table-row" : "none";
      };
    });
  }

  if (currentStudent === ADMIN_NAME) {
    currentStudent = null;
    localStorage.removeItem("mathAppStudent");
    showLogin();
  } else if (currentStudent && STUDENTS.includes(currentStudent)) {
    showSelect();
  } else {
    showLogin();
  }
</script>
</body>
</html>

  const TIME_LIMIT = 10 * 60; // 10 минут әр сұраққа
  const MAX_ATTEMPTS = 3;

  let currentStudent = localStorage.getItem("mathAppStudent") || null;
  let isAdmin = false;
  let currentTourKey = null;
  let currentGrade = null;
  let currentTasks = null;
  let currentIndex = 0;
  let score = 0;
  let answers = {};
  let missed = [];
  let secondsLeft = TIME_LIMIT;
  let attemptsLeft = MAX_ATTEMPTS;
  let timerHandle = null;
  let reviewMode = false;

  function normalizeAnswer(str) {
    return str
      .toLowerCase()
      .replace(/ё/g, "е")
      .replace(/[–—]/g, "-")
      .replace(/\bи\b/g, ",")
      .replace(/\s*-\s*/g, "-")
      .split(/[,;]+/)
      .map((p) => p.trim().replace(/\s+/g, " "))
      .filter((p) => p.length > 0)
      .sort()
      .join(",");
  }

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${String(sec).padStart(2, "0")}`;
  }

  function hideAll() {
    document.getElementById("login").style.display = "none";
    document.getElementById("select").style.display = "none";
    document.getElementById("admin").style.display = "none";
  }

  function showLogin() {
    hideAll();
    document.getElementById("login").style.display = "block";
    document.getElementById("admin-password").style.display = "none";
    document.getElementById("admin-error").textContent = "";
    const box = document.getElementById("login-buttons");
    box.innerHTML = "";
    for (const name of STUDENTS) {
      const btn = document.createElement("button");
      btn.textContent = name;
      btn.onclick = () => {
        if (name === ADMIN_NAME) {
          document.getElementById("admin-password").style.display = "block";
          document.getElementById("admin-password-input").focus();
        } else {
          currentStudent = name;
          localStorage.setItem("mathAppStudent", name);
          showSelect();
        }
      };
      box.appendChild(btn);
    }
  }

  document.getElementById("admin-password-btn").onclick = () => {
    const pw = document.getElementById("admin-password-input").value;
    if (pw === ADMIN_PASSWORD) {
      currentStudent = ADMIN_NAME;
      isAdmin = true;
      localStorage.setItem("mathAppStudent", ADMIN_NAME);
      showAdmin();
    } else {
      document.getElementById("admin-error").textContent = "Қате пароль.";
    }
  };
  document.getElementById("admin-password-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("admin-password-btn").click();
  });

  function showAdmin() {
    hideAll();
    document.getElementById("admin").style.display = "block";
  }

  function populateGrades() {
    const tourKey = document.getElementById("tour-select").value;
    const gradeSelect = document.getElementById("grade-select");
    gradeSelect.innerHTML = "";
    const grades = Object.keys(TOURS[tourKey].grades).sort((a, b) => a - b);
    for (const g of grades) {
      const opt = document.createElement("option");
      opt.value = g;
      opt.textContent = `${g} сынып`;
      gradeSelect.appendChild(opt);
    }
  }

  function showSelect() {
    hideAll();
    document.getElementById("select").style.display = "block";
    document.getElementById("greeting").textContent = currentStudent;

    const tourSelect = document.getElementById("tour-select");
    tourSelect.innerHTML = "";
    for (const key in TOURS) {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = TOURS[key].label;
      tourSelect.appendChild(opt);
    }
    tourSelect.onchange = populateGrades;

    populateGrades();
  }

  function logout() {
    currentStudent = null;
    isAdmin = false;
    localStorage.removeItem("mathAppStudent");
    showLogin();
  }

  document.getElementById("logout").onclick = logout;
  document.getElementById("logout-admin").onclick = logout;

  document.getElementById("start-btn").onclick = () => {
    currentGrade = document.getElementById("grade-select").value;
    currentTourKey = document.getElementById("tour-select").value;
    currentTasks = TOURS[currentTourKey].grades[currentGrade];
    currentIndex = 0;
    score = 0;
    answers = {};
    missed = [];
    reviewMode = false;
    document.getElementById("select").style.display = "none";
    document.getElementById("result").innerHTML = "";
    renderQuestion();
  };

  function renderQuestion() {
    const task = currentTasks[currentIndex];
    attemptsLeft = MAX_ATTEMPTS;

    const quiz = document.getElementById("quiz");
    quiz.style.display = "block";

    const timerHtml = reviewMode
      ? `<div class="timer">Уақыт шектеусіз (папамен бірге)</div>`
      : `<div class="timer" id="timer">${formatTime(TIME_LIMIT)}</div>`;

    quiz.innerHTML = `
      <div class="task">
        ${timerHtml}
        <p><b>${task.id}/${currentTasks.length}.</b> ${task.text} <span class="points">(${task.points} балл)</span></p>
        <p class="points" id="attempts-left">Талпыныс: ${attemptsLeft} / ${MAX_ATTEMPTS}</p>
        <input type="text" id="answer-input" placeholder="Жауабы" autofocus />
        <div>
          <button id="submit-btn">Жауап беру</button>
        </div>
        <div id="feedback"></div>
      </div>
    `;

    document.getElementById("submit-btn").onclick = () => checkAnswer(false);
    document.getElementById("answer-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkAnswer(false);
    });

    clearInterval(timerHandle);
    if (!reviewMode) {
      secondsLeft = TIME_LIMIT;
      timerHandle = setInterval(() => {
        secondsLeft--;
        const timerEl = document.getElementById("timer");
        timerEl.textContent = formatTime(secondsLeft);
        if (secondsLeft <= 60) timerEl.classList.add("low");
        if (secondsLeft <= 0) {
          clearInterval(timerHandle);
          checkAnswer(true);
        }
      }, 1000);
    }
  }

  function checkAnswer(timedOut) {
    const task = currentTasks[currentIndex];
    const input = document.getElementById("answer-input");
    const given = timedOut ? "" : input.value.trim();
    const isCorrect = !timedOut && given.length > 0 && normalizeAnswer(given) === normalizeAnswer(task.answer);

    if (!isCorrect && !timedOut) {
      attemptsLeft--;
    }

    const outOfTries = !isCorrect && attemptsLeft <= 0;

    if (isCorrect || timedOut || outOfTries) {
      clearInterval(timerHandle);
      input.disabled = true;
      document.getElementById("submit-btn").disabled = true;
      input.classList.add(isCorrect ? "correct" : "wrong");

      if (!reviewMode) {
        answers[task.id] = { given, correct: isCorrect, attempts: MAX_ATTEMPTS - attemptsLeft + (isCorrect ? 1 : 0) };
      }

      const feedback = document.getElementById("feedback");
      feedback.className = "feedback " + (isCorrect ? "correct" : "wrong");
      if (isCorrect) {
        if (!reviewMode) score += task.points;
        feedback.textContent = `Дұрыс! Жауабы: ${task.answer}. Келесі есепке өтейік.`;
      } else {
        if (!reviewMode) missed.push(task);
        if (reviewMode) {
          feedback.textContent = `Талпыныстар бітті.`;
          const explainDiv = document.createElement("div");
          explainDiv.className = "explain";
          explainDiv.innerHTML = `<b>Толық шешімі:</b> ${task.explain || "Түсіндірме жоқ."} <br><b>Жауабы:</b> ${task.answer}`;
          feedback.appendChild(explainDiv);
        } else if (timedOut) {
          feedback.textContent = `Уақыт бітті. Бұл есепті папамен бірге шешейік!`;
        } else {
          feedback.textContent = `Талпыныстар бітті. Бұл есепті папамен бірге шешейік!`;
        }
      }

      const nextBtn = document.createElement("button");
      nextBtn.textContent = currentIndex + 1 < currentTasks.length ? "Келесі сұрақ" : "Аяқтау";
      nextBtn.onclick = nextQuestion;
      feedback.appendChild(document.createElement("br"));
      feedback.appendChild(nextBtn);
    } else {
      document.getElementById("attempts-left").textContent = `Талпыныс: ${attemptsLeft} / ${MAX_ATTEMPTS}`;
      const feedback = document.getElementById("feedback");
      feedback.className = "feedback wrong";
      feedback.textContent = `Қате жауап. Тағы ${attemptsLeft} талпыныс бар — қайталап көр!`;
      input.value = "";
      input.focus();
    }
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentTasks.length) {
      renderQuestion();
    } else if (reviewMode) {
      finishReview();
    } else {
      finishQuiz();
    }
  }

  function finishReview() {
    document.getElementById("quiz").style.display = "none";
    const result = document.getElementById("result");
    result.innerHTML = `<div>Қайталау аяқталды!</div>`;
    const back = document.createElement("button");
    back.textContent = "Админ панеліне оралу";
    back.onclick = () => {
      result.innerHTML = "";
      showAdmin();
    };
    result.appendChild(back);
  }

  async function finishQuiz() {
    document.getElementById("quiz").style.display = "none";
    const maxScore = currentTasks.reduce((sum, t) => sum + t.points, 0);
    const result = document.getElementById("result");
    result.innerHTML = `<div id="final-score">Нәтиже: ${score} / ${maxScore} балл</div>`;

    if (missed.length > 0) {
      const review = document.createElement("div");
      review.innerHTML = `<h2>Папамен бірге шешетін есептер</h2>`;
      for (const task of missed) {
        const div = document.createElement("div");
        div.className = "task";
        div.innerHTML = `
          <p><b>${task.id}.</b> ${task.text} <span class="points">(${task.points} балл)</span></p>
          <p><i>Дұрыс жауабы (папаға): ${task.answer}</i></p>
        `;
        review.appendChild(div);
      }
      result.appendChild(review);
    }

    const again = document.createElement("button");
    again.textContent = "Тағы бір тест шешу";
    again.onclick = () => {
      result.innerHTML = "";
      showSelect();
    };
    result.appendChild(again);

    const { error } = await client.from("workshop_data").insert({
      participant_id: PARTICIPANT_ID,
      item_type: "attempt",
      data: {
        student: currentStudent,
        tour: currentTourKey,
        tourLabel: TOURS[currentTourKey].label,
        grade: currentGrade,
        date: todayStr(),
        score,
        maxScore,
        answers,
      },
    });
    if (error) console.error(error);

    loadHistory();
  }

  function startReview(row) {
    const tourKey = row.data.tour;
    const grade = row.data.grade;
    const tourData = TOURS[tourKey];
    if (!tourData || !tourData.grades[grade]) return;
    const allTasks = tourData.grades[grade];
    const answersObj = row.data.answers || {};
    const wrongTasks = allTasks.filter((t) => {
      const entry = answersObj[t.id];
      if (!entry) return false;
      const correct = typeof entry === "string" ? undefined : entry.correct;
      return correct !== true;
    });
    if (wrongTasks.length === 0) return;

    currentTourKey = tourKey;
    currentGrade = grade;
    currentTasks = wrongTasks;
    currentIndex = 0;
    score = 0;
    answers = {};
    missed = [];
    reviewMode = true;
    hideAll();
    document.getElementById("result").innerHTML = "";
    renderQuestion();
  }

  async function loadHistory() {
    const { data, error } = await client
      .from("workshop_data")
      .select("*")
      .eq("participant_id", PARTICIPANT_ID)
      .eq("item_type", "attempt")
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      return;
    }

    const body = document.getElementById("history-body");
    body.innerHTML = "";
    data.forEach((row, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${row.data.student || ""}</td>
        <td>${row.data.tourLabel || ""}</td>
        <td>${row.data.grade || ""}</td>
        <td>${row.data.date}</td>
        <td>${row.data.score} / ${row.data.maxScore}</td>
        <td><button type="button" data-idx="${i}">Толығырақ</button></td>
      `;
      body.appendChild(tr);

      const detailTr = document.createElement("tr");
      detailTr.style.display = "none";
      const detailTd = document.createElement("td");
      detailTd.colSpan = 6;

      const answersObj = row.data.answers || {};
      const items = Object.keys(answersObj)
        .sort((a, b) => a - b)
        .map((qId) => {
          const entry = answersObj[qId];
          const legacy = typeof entry === "string";
          const given = legacy ? entry : entry && entry.given;
          const correct = legacy ? undefined : entry && entry.correct;
          const mark = correct === true ? "✓ дұрыс" : correct === false ? "✗ қате" : "— ескі жазба";
          const givenText = given ? ` (жауабы: ${given})` : " (жауап берілмеді)";
          return `${qId}-сұрақ: ${mark}${givenText}`;
        });
      detailTd.innerHTML = items.map((t) => `<div>${t}</div>`).join("");

      if (isAdmin) {
        const hasWrong = Object.values(answersObj).some((entry) => {
          const correct = typeof entry === "string" ? undefined : entry && entry.correct;
          return correct === false || correct === undefined;
        });
        if (hasWrong) {
          const reviewBtn = document.createElement("button");
          reviewBtn.type = "button";
          reviewBtn.textContent = "Папамен бірге қайта шешу";
          reviewBtn.onclick = () => startReview(row);
          detailTd.appendChild(document.createElement("br"));
          detailTd.appendChild(reviewBtn);
        }
      }

      detailTr.appendChild(detailTd);
      body.appendChild(detailTr);

      tr.querySelector("button").onclick = () => {
        detailTr.style.display = detailTr.style.display === "none" ? "table-row" : "none";
      };
    });
  }

  if (currentStudent === ADMIN_NAME) {
    currentStudent = null;
    localStorage.removeItem("mathAppStudent");
    showLogin();
  } else if (currentStudent && STUDENTS.includes(currentStudent)) {
    showSelect();
  } else {
    showLogin();
  }
  loadHistory();
</script>
</body>
</html>

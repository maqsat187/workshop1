<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Таирдың есептері</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; }
  .task { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 14px 0; }
  .task p { margin: 0 0 10px; line-height: 1.5; }
  .points { color: #888; font-size: 13px; }
  .timer { font-size: 20px; font-weight: bold; margin-bottom: 12px; }
  .timer.low { color: #d9483d; }
  input[type="text"] { padding: 8px; width: 100%; box-sizing: border-box; font-size: 15px; }
  input[type="text"].correct { border: 2px solid #2e9e3f; background: #f1fbf2; }
  input[type="text"].wrong { border: 2px solid #d9483d; background: #fdf1f0; }
  button { padding: 10px 16px; font-size: 15px; margin-top: 10px; cursor: pointer; }
  .feedback { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 15px; }
  .feedback.correct { background: #f1fbf2; color: #206d2c; }
  .feedback.wrong { background: #fdf1f0; color: #a3352b; }
  #result { font-size: 18px; font-weight: bold; margin: 16px 0; }
  #history { margin-top: 32px; }
  #history table { border-collapse: collapse; width: 100%; }
  #history td, #history th { border: 1px solid #ddd; padding: 6px 10px; text-align: left; font-size: 14px; }
  #already-done { padding: 14px; background: #f1fbf2; border-radius: 8px; }
</style>
</head>
<body>
  <h1>Таир, бүгінгі математикалық есептер (4 сынып)</h1>

  <div id="already-done" style="display:none;"></div>

  <div id="quiz" style="display:none;"></div>

  <div id="result"></div>

  <div id="history">
    <h2>Нәтижелер тарихы</h2>
    <table id="history-table">
      <thead><tr><th>Күні</th><th>Балл</th></tr></thead>
      <tbody id="history-body"></tbody>
    </table>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://pkdczbbsbghenpbzlnfx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_39eOXkGns1W7YkqovFNxeQ_snSmzaYk";
  const PARTICIPANT_ID = "k7m2xq";

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const TASKS = [
    { id: 1, points: 1, answer: "18",
      text: "Сыныпта әр партада екі оқушыдан отырады. Екі ұл отырған парталар саны екі қыз отырған парталар санынан екі есе артық. Ал екі қыз отырған парталар саны ұл мен қыз отырған парталар санынан екі есе артық. Сыныпта 10 қыз бар екені белгілі болса, онда сыныпта қанша ұл бар?" },
    { id: 2, points: 1, answer: "4",
      text: "Екітаңбалы жай сан екі әртүрлі цифрлардан тұрады. Екі цифрды ауыстырғанда, басқа жай сан пайда болады, мұндай сандар жұбын айналы сандар деп атайық. Осындай екітаңбалы айналы сандар нешеу? (жай сандар деп тек 1-ге және өзіне ғана бөлінетін сандарды айтады)" },
    { id: 3, points: 1, answer: "1",
      text: "Винни – Пух достарын балмен қонақ қылуды ұйғарды. Ол балы бар құмыраны өлшегенде 9 кг болды. Винни – Пух достары келем дегенше балдың жартысын өзі жеп қойды, қалғанының жартысын Пятачок жеді, ал одан қалғанының жартысын Кролик жеді. Осыдан кейін қалған балы бар құмыраны өлшегенде ол енді 2 кг болды. Құмыраның салмағы қанша?" },
    { id: 4, points: 1, answer: "2",
      text: "Кітаптың 80 парағының қалыңдығы 1 см. Егер осы кітаптың беттерін нөмірлеуге 852 цифр кетсе, бүкіл кітаптың қалыңдығы қанша?" },
    { id: 5, points: 1, answer: "15",
      text: "Цифрларының қосындысы 5-ке тең болатын неше үштаңбалы сан бар?" },
    { id: 6, points: 1, answer: "14",
      text: "«Достық» аралында тышқан-мысық ойынын жақсы көретін тышқандар мен мысықтар өмір сүреді. Бүгін 26 тышқан мен бірнеше мысық ойнады. Ойын кезінде әр тышқан 7 мысықтан ұстап алды, ал әр мысық 13 реттен ұсталды. Тышқан-мысық ойынын неше мысық ойнады?" },
    { id: 7, points: 2, answer: "25",
      text: "Биыл Айдар мен Әсеттің жастарының қосындысы 60 жасты құрайды. 2 жыл бұрын Әсет пен Мақсаттың да жастарының қосындысы 60 жасты құраған, ал 3 жылдан кейін Айдар мен Мақсаттыкі де 60 жас болады. Айдар биыл нешеде?" },
    { id: 8, points: 2, answer: "1400",
      text: "Жас жігіт жыл соңында мопед және 1600$ алу үшін курьер болып жұмысқа орналасты. Бірақ ол 8 айдан кейін жұмыстан шығып кетті, оған есептескенде мопед және 600$ берді. Мопед қанша тұрады?" },
    { id: 9, points: 2, answer: "184",
      text: "Қабырғасы 1 см болатын кубиктің барлық жағын бояп шығу үшін 6 грамм бояу қажет. Қыры 2 см болатын бірдей алты кубикті суреттегідей етіп жапсырды. Осы фигураны бояп шығу үшін қанша бояу қажет?" },
    { id: 10, points: 3, answer: "27",
      text: "Мына тұжырымдардың үшеуі ақиқат, ал біреуі жалған болатын сандар нешеу? X – екітаңбалы сан, Х – 5-ке бөлінеді, Х – 50-ден артық емес, Х – тақ сан." },
  ];
  const MAX_SCORE = TASKS.reduce((sum, t) => sum + t.points, 0);
  const TIME_LIMIT = 10 * 60; // 10 минут əр сұраққа

  let currentIndex = 0;
  let score = 0;
  const answers = {};
  let secondsLeft = TIME_LIMIT;
  let timerHandle = null;

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${String(sec).padStart(2, "0")}`;
  }

  function renderQuestion() {
    const task = TASKS[currentIndex];
    secondsLeft = TIME_LIMIT;

    const quiz = document.getElementById("quiz");
    quiz.style.display = "block";
    quiz.innerHTML = `
      <div class="task">
        <div class="timer" id="timer">${formatTime(secondsLeft)}</div>
        <p><b>${task.id}/${TASKS.length}.</b> ${task.text} <span class="points">(${task.points} балл)</span></p>
        <input type="text" id="answer-input" placeholder="Жауабы" autofocus />
        <div>
          <button id="submit-btn">Жауап беру</button>
        </div>
        <div id="feedback"></div>
      </div>
    `;

    document.getElementById("submit-btn").onclick = () => checkAnswer(false);
    document.getElementById("answer-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkAnswer(false);
    });

    clearInterval(timerHandle);
    timerHandle = setInterval(() => {
      secondsLeft--;
      const timerEl = document.getElementById("timer");
      timerEl.textContent = formatTime(secondsLeft);
      if (secondsLeft <= 60) timerEl.classList.add("low");
      if (secondsLeft <= 0) {
        clearInterval(timerHandle);
        checkAnswer(true);
      }
    }, 1000);
  }

  function checkAnswer(timedOut) {
    clearInterval(timerHandle);
    const task = TASKS[currentIndex];
    const input = document.getElementById("answer-input");
    const given = timedOut ? "" : input.value.trim();
    answers[task.id] = given;

    const isCorrect = !timedOut && given.toLowerCase() === task.answer.toLowerCase();
    input.disabled = true;
    document.getElementById("submit-btn").disabled = true;
    input.classList.add(isCorrect ? "correct" : "wrong");

    const feedback = document.getElementById("feedback");
    feedback.className = "feedback " + (isCorrect ? "correct" : "wrong");
    if (isCorrect) {
      score += task.points;
      feedback.textContent = `Дұрыс! Жауабы: ${task.answer}. Келесі есепке өтейік.`;
    } else if (timedOut) {
      feedback.textContent = `Уақыт бітті. Дұрыс жауап: ${task.answer}. Папамен бірге шешейік!`;
    } else {
      feedback.textContent = `Қате жауап. Дұрыс жауап: ${task.answer}. Папамен бірге шешейік!`;
    }

    const nextBtn = document.createElement("button");
    nextBtn.textContent = currentIndex + 1 < TASKS.length ? "Келесі сұрақ" : "Аяқтау";
    nextBtn.onclick = nextQuestion;
    feedback.appendChild(document.createElement("br"));
    feedback.appendChild(nextBtn);
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < TASKS.length) {
      renderQuestion();
    } else {
      finishQuiz();
    }
  }

  async function finishQuiz() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").textContent =
      `Нәтиже: ${score} / ${MAX_SCORE} балл`;

    const { error } = await client.from("workshop_data").insert({
      participant_id: PARTICIPANT_ID,
      item_type: "attempt",
      data: { date: todayStr(), score, maxScore: MAX_SCORE, answers },
    });
    if (error) console.error(error);

    loadHistory();
  }

  async function loadHistory() {
    const { data, error } = await client
      .from("workshop_data")
      .select("*")
      .eq("participant_id", PARTICIPANT_ID)
      .eq("item_type", "attempt")
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      return;
    }

    const body = document.getElementById("history-body");
    body.innerHTML = "";
    for (const row of data) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${row.data.date}</td><td>${row.data.score} / ${row.data.maxScore}</td>`;
      body.appendChild(tr);
    }

    const doneToday = data.find((row) => row.data.date === todayStr());
    if (doneToday) {
      document.getElementById("already-done").style.display = "block";
      document.getElementById("already-done").textContent =
        `Бүгін есептер шешілді. Нәтиже: ${doneToday.data.score} / ${doneToday.data.maxScore} балл. Ертең жаңа есептер!`;
    } else {
      renderQuestion();
    }
  }

  loadHistory();
</script>
</body>
</html>
